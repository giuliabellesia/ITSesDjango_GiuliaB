{% extends "base.html" %}
{% block content %}
    {% if object.pk %}
        <h1>Modifica il giorno {{ object.pk }}</h1>
    {% else %}
        <h1>Inserisci un nuovo giorno</h1>
    {% endif %}
    <form action="" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="submit" value="Inserisci">
    </form>
{% endblock %}
