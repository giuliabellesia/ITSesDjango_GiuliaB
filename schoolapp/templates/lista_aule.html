{% extends "base_list.html" %}
{% block custom-type %}Aule{% endblock %}
{% block list-header %}<th>Id</th><th>Nome</th><th>Capacita</th>{% endblock %}
{% block list-rows %}
    {% for aula in object_list %}
        <tr>
            <td>{{ aula.id }}</td>
            <td>{{ aula.nome }}</td>
            <td>{{ aula.capacita }}</td>
            <td><a href="{% url 'dettaglio_aula' aula.pk %}">{{ aula.nome }}</a></td>
        </tr>
    {% endfor %}
{% endblock %}
